openapi: 3.0.3
info:
  title: Digital Academy User API
  version: 1.0.0
  description: 'User, Teacher API '
paths:
  /auth/google/login/:
    get:
      operationId: auth_google_login_retrieve
      tags:
      - auth
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags:
      - auth
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdate'
          description: ''
  /auth/set-password/{user_id}/:
    patch:
      operationId: auth_set_password_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPassword'
        required: true
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /category/:
    get:
      operationId: category_list
      tags:
      - category
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /category/{id}/:
    get:
      operationId: category_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this category.
        required: true
      tags:
      - category
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /comments/:
    get:
      operationId: comments_list
      tags:
      - comments
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
          description: ''
    post:
      operationId: comments_create
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentCreate'
        required: true
      security:
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreate'
          description: ''
  /courses/:
    get:
      operationId: courses_list
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            type: string
            format: uuid
        explode: true
        style: form
      - in: query
        name: price_max
        schema:
          type: integer
      - in: query
        name: price_min
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - courses
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseUserList'
          description: ''
  /courses/{slug}/:
    get:
      operationId: courses_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - courses
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /enrolment/:
    get:
      operationId: enrolment_list
      tags:
      - enrolment
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderList'
          description: ''
    post:
      operationId: enrolment_create
      tags:
      - enrolment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      security:
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreate'
          description: ''
  /leaderboard/:
    get:
      operationId: leaderboard_list
      tags:
      - leaderboard
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leaderboard'
          description: ''
  /leaderboard/{id}/:
    get:
      operationId: leaderboard_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this leaderboard.
        required: true
      tags:
      - leaderboard
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
          description: ''
  /my-courses/:
    get:
      operationId: my_courses_list
      tags:
      - my-courses
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseStudent'
          description: ''
  /my-courses/{id}/:
    get:
      operationId: my_courses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this course student.
        required: true
      tags:
      - my-courses
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseStudentDetail'
          description: ''
  /my-courses/{id}/certificate/:
    post:
      operationId: my_courses_certificate_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this course student.
        required: true
      tags:
      - my-courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseStudent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseStudent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseStudent'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseStudent'
          description: ''
  /quiz/:
    get:
      operationId: quiz_list
      tags:
      - quiz
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizList'
          description: ''
    post:
      operationId: quiz_create
      tags:
      - quiz
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuizList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuizList'
        required: true
      security:
      - Bearer: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizList'
          description: ''
  /quiz-result/:
    get:
      operationId: quiz_result_list
      tags:
      - quiz-result
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizResult'
          description: ''
  /quiz-result/{id}/:
    get:
      operationId: quiz_result_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this quiz result.
        required: true
      tags:
      - quiz-result
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResult'
          description: ''
  /quiz/{id}/:
    get:
      operationId: quiz_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - quiz
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetail'
          description: ''
  /quiz/{id}/submit/:
    post:
      operationId: quiz_submit_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - quiz
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuizSubmit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuizSubmit'
        required: true
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSubmit'
          description: ''
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 50
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - slug
      - title
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        avatar_url:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        comment:
          type: string
        likes:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
      required:
      - avatar_url
      - comment
      - first_name
      - id
    CommentCreate:
      type: object
      properties:
        course:
          type: string
          format: uuid
        comment:
          type: string
        likes:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - comment
      - course
    CourseDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        cover_img:
          type: string
          format: uri
          nullable: true
        desc:
          type: string
        base_price:
          type: integer
          maximum: 2147483647
          minimum: 0
        discount_price:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        units:
          type: array
          items:
            $ref: '#/components/schemas/CourseUnitList'
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        similar_courses:
          type: string
          readOnly: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
        avg_rating:
          type: number
          format: double
          readOnly: true
        comments_count:
          type: integer
          readOnly: true
        students_count:
          type: integer
          readOnly: true
      required:
      - avg_rating
      - base_price
      - comments
      - comments_count
      - desc
      - id
      - similar_courses
      - slug
      - students_count
      - title
      - units
    CourseStudent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course:
          type: string
          format: uuid
        progress:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusCd2Enum'
        certificate_pdf:
          type: string
          format: uri
          nullable: true
      required:
      - course
      - id
    CourseStudentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/StudentCourseList'
          readOnly: true
        progress:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusCd2Enum'
      required:
      - course
      - id
    CourseUnitList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        desc:
          type: string
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lessons'
          readOnly: true
      required:
      - desc
      - id
      - lessons
      - title
    CourseUserList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cover_img:
          type: string
          format: uri
          nullable: true
        title:
          type: string
          maxLength: 120
        desc:
          type: string
        base_price:
          type: integer
          maximum: 2147483647
          minimum: 0
        discount_price:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        avg_rating:
          type: number
          format: double
          readOnly: true
        students_count:
          type: integer
          readOnly: true
      required:
      - avg_rating
      - base_price
      - desc
      - id
      - slug
      - students_count
      - title
    Leaderboard:
      type: object
      properties:
        username:
          type: string
          readOnly: true
        tier:
          $ref: '#/components/schemas/TierEnum'
        total_stars:
          type: integer
          maximum: 2147483647
          minimum: 0
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        reward_coin:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - username
    Lessons:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        video:
          type: string
          format: uri
          nullable: true
        presentation:
          type: string
          format: uri
          nullable: true
        additional_task:
          type: string
          maxLength: 120
      required:
      - additional_task
      - id
      - title
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
    OrderCreate:
      type: object
      properties:
        course:
          type: string
          format: uuid
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
      required:
      - course
    OrderList:
      type: object
      properties:
        course_title:
          type: string
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        status:
          $ref: '#/components/schemas/OrderListStatusEnum'
      required:
      - course_title
    OrderListStatusEnum:
      enum:
      - PENDING
      - PAID
      - CANCELED
      type: string
      description: |-
        * `PENDING` - pending
        * `PAID` - paid
        * `CANCELED` - canceled
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        username:
          type: string
          nullable: true
          maxLength: 50
        coin:
          type: integer
          maximum: 2147483647
          minimum: 0
        phone_number:
          type: string
          nullable: true
          maxLength: 20
      required:
      - id
    ProfileUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        username:
          type: string
          nullable: true
          maxLength: 50
        phone_number:
          type: string
          nullable: true
          maxLength: 20
      required:
      - id
    QuestionList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        question_text:
          type: string
        points:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantCreate'
          readOnly: true
      required:
      - id
      - question_text
      - variants
    QuizAnswerItem:
      type: object
      properties:
        question:
          type: string
          format: uuid
        variant:
          type: string
          format: uuid
      required:
      - question
      - variant
    QuizDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lesson:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
        description:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionList'
          readOnly: true
        is_finished:
          type: boolean
        due_at:
          type: string
          format: date-time
          nullable: true
      required:
      - description
      - id
      - lesson
      - questions
      - title
    QuizList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
        is_finished:
          type: boolean
        due_at:
          type: string
          format: date-time
          nullable: true
        questions_count:
          type: integer
          readOnly: true
      required:
      - description
      - id
      - questions_count
      - title
    QuizResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        quiz_title:
          type: string
          readOnly: true
        correct_answers:
          type: integer
          maximum: 2147483647
          minimum: 0
        wrong_answers:
          type: integer
          maximum: 2147483647
          minimum: 0
        total_questions:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/QuizResultStatusEnum'
        stars:
          type: integer
          maximum: 2147483647
          minimum: 0
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        attempt:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - quiz_title
    QuizResultStatusEnum:
      enum:
      - PASSED
      - FAILED
      type: string
      description: |-
        * `PASSED` - Passed
        * `FAILED` - Failed
    QuizSubmit:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuizAnswerItem'
      required:
      - answers
    SetPassword:
      type: object
      properties:
        new_password1:
          type: string
          writeOnly: true
        new_password2:
          type: string
          writeOnly: true
      required:
      - new_password1
      - new_password2
    StatusCd2Enum:
      enum:
      - COMPLETED
      - IN_PROGRESS
      type: string
      description: |-
        * `COMPLETED` - Completed
        * `IN_PROGRESS` - In Progress
    StudentCourseList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        units:
          type: array
          items:
            $ref: '#/components/schemas/StudentCourseUnitList'
          readOnly: true
      required:
      - id
      - units
    StudentCourseUnitList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        desc:
          type: string
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/StudentLessons'
          readOnly: true
      required:
      - desc
      - id
      - lessons
      - title
    StudentLessons:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        video:
          type: string
          format: uri
          nullable: true
        presentation:
          type: string
          format: uri
          nullable: true
        additional_task:
          type: string
          maxLength: 120
        quizzes:
          type: array
          items:
            $ref: '#/components/schemas/QuizDetail'
          readOnly: true
      required:
      - additional_task
      - id
      - quizzes
      - title
    TierEnum:
      enum:
      - BRONZE
      - SILVER
      - GOLD
      - PLATINUM
      type: string
